name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install lint tooling
        run: pip install ruff==0.11.13
      - name: Lint
        run: ruff check src scripts examples
      - name: Byte-compile
        run: python -m compileall -q src scripts examples
      - name: Check version consistency
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          pyproject = (root / "pyproject.toml").read_text(encoding="utf-8")
          init = (root / "src/label_controllers/__init__.py").read_text(encoding="utf-8")
          declared = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.MULTILINE)
          runtime = re.search(r'__version__\s*=\s*"([^"]+)"', init)
          if not declared or not runtime:
              sys.exit("version string not found")
          if declared.group(1) != runtime.group(1):
              sys.exit(f"version drift: pyproject={declared.group(1)} __init__={runtime.group(1)}")
          print(f"version ok: {declared.group(1)}")
          PY

  docker-build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose files
        run: docker compose -f compose.yaml -f compose.gpu.yaml config > /dev/null
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: label-controllers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max