services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: label-controllers:cuda
    environment:
      LABEL_CONTROLLERS_DEVICE: cuda
      LABEL_CONTROLLERS_DEVICE_INDEX: "${LABEL_CONTROLLERS_DEVICE_INDEX:-0}"
      LABEL_CONTROLLERS_OCR_DEVICE: cuda
      LABEL_CONTROLLERS_OCR_REC_BATCH_NUM: "${LABEL_CONTROLLERS_OCR_REC_BATCH_NUM:-0}"
      LABEL_CONTROLLERS_OCR_USE_ANGLE_CLS: "${LABEL_CONTROLLERS_OCR_USE_ANGLE_CLS:-false}"
    gpus: all
